<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>呆猫 · 动作预览</title><style>body{margin:0;background:#f4f1ea;color:#303440;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{text-align:center;padding:36px;max-width:650px}h1{font-size:28px;margin:0}p{color:#676c77;line-height:1.8}.stage{height:270px;display:grid;place-items:center}.pet{width:192px;height:208px;background-image:url(pet/spritesheet.png);background-size:1536px 1872px;background-repeat:no-repeat}nav{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}button{font:inherit;border:1px solid #cbcbd1;background:#fff;border-radius:18px;padding:8px 16px;cursor:pointer}button[aria-pressed=true]{background:#5b65a6;color:white;border-color:#5b65a6}small{display:block;margin-top:25px;color:#797c87}</style><main><h1>呆猫</h1><p>点选一种状态，看看它的表情和动作。</p><div class="stage"><div class="pet" role="img" aria-label="呆猫待机动画"></div></div><nav></nav><small>此页循环展示各组动作；Codex 会根据实际状态调度播放。</small></main><script>
const states=[['待机',0,6,660],['向右跑',1,8,120],['向左跑',2,8,120],['挥手',3,4,140],['跳跃',4,5,140],['出错',5,8,140],['等待',6,6,150],['工作',7,6,120],['思考',8,6,150]];
let timer;const pet=document.querySelector('.pet');const nav=document.querySelector('nav');
function play(index){clearTimeout(timer);const [name,row,count,duration]=states[index];let frame=0;pet.setAttribute('aria-label','呆猫'+name+'动画');nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===index));function step(){pet.style.backgroundPosition=(-frame*192)+'px '+(-row*208)+'px';let delay=row===0?[1680,660,660,840,840,1920][frame]:duration+(frame===count-1?120:0);frame=(frame+1)%count;timer=setTimeout(step,delay)}step()}
states.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0];b.onclick=()=>play(i);nav.appendChild(b)});play(0);
</script></html>
